# Site estático da Bianchi Engenharia (incluído no bloco "http" do nginx)
log_format site '$remote_addr - $remote_user [$time_local] "$request" $status $body_bytes_sent '
                '"$http_referer" "$http_user_agent" rt=$request_time';
limit_req_zone $binary_remote_addr zone=be_site:10m rate=30r/s;
limit_conn_zone $binary_remote_addr zone=be_conexoes:10m;
limit_req_status 429;
limit_conn_status 429;

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;
  client_max_body_size 1k;

  set_real_ip_from 10.0.0.0/8;
  set_real_ip_from 172.16.0.0/12;
  set_real_ip_from 192.168.0.0/16;
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;

  access_log /dev/stdout site;
  access_log /var/log/nginx/site/acesso.log site;

  limit_conn be_conexoes 40;
  limit_req zone=be_site burst=100 nodelay;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options SAMEORIGIN always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  gzip on;
  gzip_types text/css application/javascript image/svg+xml font/ttf;

  # Página inicial
  location = / {
    return 302 /portfolio.html;
  }

  # Robôs procurando falhas: fecha a conexão (o fail2ban bloqueia o IP depois)
  location ~* "(\.(php[0-9]?|phtml|asp|aspx|jsp|cgi|env|ini|bak|old|sql|sqlite|log|yml|yaml|toml|htaccess|htpasswd|DS_Store)$|/\.(git|env|svn|hg|aws|ssh|docker|vscode)|/wp-|/wordpress|/phpmyadmin|/pma/|/cgi-bin|/xmlrpc|/vendor/phpunit|/actuator|/server-status|/etc/passwd|\.\./)" {
    return 444;
  }

  # Imagens, fontes, CSS e JS: cache de 7 dias
  location ~* \.(jpe?g|png|webp|gif|svg|ico|woff2?|ttf|css|js)$ {
    expires 7d;
    add_header Cache-Control "public";
    add_header X-Content-Type-Options nosniff always;
    try_files $uri =404;
  }

  # Páginas: o navegador sempre confere se há versão nova (sem isso, depois de um deploy
  # o visitante continua vendo a página antiga guardada no cache por horas)
  location ~* \.html$ {
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ =404;
  }
}
